<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Form Handling</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <style>
        .invalid-feedback {
            display: none;
        }

        .invalid-feedback.show {
            display: block;
        }
    </style>
</head>

<body>

    <div class="container mt-5 mb-5">

        <h1 class="mb-4">Registration Form</h1>

        <form id="registrationForm">

            <!-- First Name + Last Name -->

            <div class="row">

                <div class="col-sm-6 mb-4">

                    <label for="fname" class="form-label">
                        First Name
                    </label>

                    <input
                        type="text"
                        class="form-control"
                        name="fname"
                        id="fname"
                    >

                    <div class="invalid-feedback fname-error">
                        First Name is invalid
                    </div>

                </div>


                <div class="col-sm-6 mb-4">

                    <label for="lname" class="form-label">
                        Last Name
                    </label>

                    <input
                        type="text"
                        class="form-control"
                        name="lname"
                        id="lname"
                    >

                    <div class="invalid-feedback lname-error">
                        Last Name is invalid
                    </div>

                </div>

            </div>


            <!-- Email -->

            <div class="mb-4">

                <label for="email" class="form-label">
                    Email
                </label>

                <input
                    type="text"
                    class="form-control"
                    name="email"
                    id="email"
                >

                <div class="invalid-feedback email-error">
                    Email is invalid
                </div>

            </div>


            <!-- Phone -->

            <div class="mb-4">

                <label for="phone" class="form-label">
                    Phone
                </label>

                <input
                    type="text"
                    class="form-control"
                    name="phone"
                    id="phone"
                >

                <div class="invalid-feedback phone-error">
                    Phone is invalid
                </div>

            </div>


            <!-- Password -->

            <div class="mb-4">

                <label for="password" class="form-label">
                    Password
                </label>

                <input
                    type="password"
                    class="form-control"
                    name="password"
                    id="password"
                >

                <div class="invalid-feedback password-error">
                    Password is invalid
                </div>

            </div>


            <!-- DOB + Gender -->

            <div class="row">

                <!-- DOB -->

                <div class="col-sm-4 mb-4">

                    <label for="dob" class="form-label">
                        DOB
                    </label>

                    <input
                        type="date"
                        class="form-control"
                        name="dob"
                        id="dob"
                    >

                    <div class="invalid-feedback dob-error">
                        DOB is invalid
                    </div>

                </div>


                <!-- Gender -->

                <div class="col-sm-8 mb-4">

                    <label class="form-label d-block">
                        Gender
                    </label>


                    <div class="form-check form-check-inline">

                        <input
                            type="radio"
                            class="form-check-input"
                            name="gender"
                            id="male"
                            value="Male"
                        >

                        <label
                            class="form-check-label"
                            for="male"
                        >
                            Male
                        </label>

                    </div>


                    <div class="form-check form-check-inline">

                        <input
                            type="radio"
                            class="form-check-input"
                            name="gender"
                            id="female"
                            value="Female"
                        >

                        <label
                            class="form-check-label"
                            for="female"
                        >
                            Female
                        </label>

                    </div>


                    <div class="form-check form-check-inline">

                        <input
                            type="radio"
                            class="form-check-input"
                            name="gender"
                            id="others"
                            value="Others"
                        >

                        <label
                            class="form-check-label"
                            for="others"
                        >
                            Others
                        </label>

                    </div>


                    <div class="invalid-feedback gender-error">
                        Please select gender
                    </div>

                </div>

            </div>


            <!-- Skills -->

            <div class="mb-4">

                <label class="form-label">
                    Skills
                </label>


                <div>

                    <div class="form-check form-check-inline">

                        <input
                            type="checkbox"
                            class="form-check-input"
                            name="skills"
                            id="html"
                            value="HTML"
                        >

                        <label
                            class="form-check-label"
                            for="html"
                        >
                            HTML
                        </label>

                    </div>


                    <div class="form-check form-check-inline">

                        <input
                            type="checkbox"
                            class="form-check-input"
                            name="skills"
                            id="css"
                            value="CSS"
                        >

                        <label
                            class="form-check-label"
                            for="css"
                        >
                            CSS
                        </label>

                    </div>


                    <div class="form-check form-check-inline">

                        <input
                            type="checkbox"
                            class="form-check-input"
                            name="skills"
                            id="javascript"
                            value="JavaScript"
                        >

                        <label
                            class="form-check-label"
                            for="javascript"
                        >
                            JavaScript
                        </label>

                    </div>


                    <div class="form-check form-check-inline">

                        <input
                            type="checkbox"
                            class="form-check-input"
                            name="skills"
                            id="python"
                            value="Python"
                        >

                        <label
                            class="form-check-label"
                            for="python"
                        >
                            Python
                        </label>

                    </div>

                </div>


                <div class="invalid-feedback skills-error">
                    Please select at least one skill
                </div>

            </div>


            <!-- Country + City -->

            <div class="row">

                <!-- Country -->

                <div class="col-sm-6 mb-4">

                    <label
                        for="country"
                        class="form-label"
                    >
                        Country
                    </label>

                    <select
                        class="form-select"
                        name="country"
                        id="country"
                    >

                        <option value="">
                            Select Country
                        </option>

                        <option value="India">
                            India
                        </option>

                        <option value="USA">
                            USA
                        </option>

                        <option value="UK">
                            UK
                        </option>

                        <option value="Canada">
                            Canada
                        </option>

                    </select>


                    <div class="invalid-feedback country-error">
                        Please select country
                    </div>

                </div>


                <!-- City -->

                <div class="col-sm-6 mb-4">

                    <label
                        for="city"
                        class="form-label"
                    >
                        City
                    </label>

                    <input
                        type="text"
                        class="form-control"
                        name="city"
                        id="city"
                    >


                    <div class="invalid-feedback city-error">
                        City is invalid
                    </div>

                </div>

            </div>


            <!-- Submit -->

            <button
                type="submit"
                class="btn btn-primary"
            >
                Submit
            </button>

        </form>

    </div>


    <script src="task5.js"></script>

</body>

</html>
