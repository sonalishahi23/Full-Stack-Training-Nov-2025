<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Users Data</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: white;
            color: black;
            padding: 40px;
        }

        h1 {
            text-align: center;
            margin-bottom: 25px;
        }

        .search-box {
            width: 90%;
            margin: 0 auto 25px;
            text-align: center;
        }

        #searchInput {
            width: 50%;
            padding: 12px;
            border: 1px solid black;
            font-size: 16px;
        }

        table {
            width: 90%;
            margin: auto;
            border-collapse: collapse;
        }

        th,
        td {
            border: 1px solid black;
            padding: 12px;
            text-align: center;
            background-color: white;
            color: black;
        }

        th {
            font-weight: bold;
        }

        #message {
            text-align: center;
            margin: 20px;
        }
    </style>
</head>

<body>

    <h1>Users Data</h1>

    <div class="search-box">

        <input
            type="text"
            id="searchInput"
            placeholder="Search user..."
        >

    </div>

    <p id="message">Loading users...</p>

    <table>

        <thead>
            <tr>
                <th>Name</th>
                <th>Email</th>
                <th>Address</th>
                <th>Phone</th>
                <th>Company Name</th>
            </tr>
        </thead>

        <tbody id="tableBody"></tbody>

    </table>

    <script src="script.js"></script>

</body>

</html>
