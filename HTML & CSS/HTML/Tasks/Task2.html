<!DOCTYPE html>
<html>
<head>
    <title>Table Layout</title>
</head>

<body>

<table border="1" width="800" align="center" cellpadding="5" cellspacing="0">

    <!-- Row 1 -->
    <tr>
        <td rowspan="7" width="30%">
            <img src="images/indixpert.png" width="100%" height="100%">
        </td>

        <td colspan="3" align="center" height="80">
            <img src="images/indixpert_logo.jpeg" width="120">
        </td>
    </tr>

    <!-- Row 2 -->
    <tr>
        <td colspan="3" height="200" align="center">
            <img src="images/download (2).jpeg" width="100%" height="200">
        </td>
    </tr>

    <!-- 🔸 THIN LINE (above images) -->
    <tr>
        <td colspan="3" height="5"></td>
    </tr>


    <!-- Row 3 (3 Images) -->
    <tr>
        <td height="100">
            <img src="images/download (4).jpeg" width="100%" height="100">
        </td>
        <td height="100">
            <img src="images/download (5).jpeg" width="100%" height="100">
        </td>
        <td height="100">
            <img src="images/images.jpeg" width="100%" height="100">
        </td>
    </tr>

    

    <!-- Footer -->
    <tr>
        <td colspan="3" align="center" height="60">
            <img src="images/download (1).png" width="100%" height="100">
        </td>
    </tr>

</table>

</body>
</html>
