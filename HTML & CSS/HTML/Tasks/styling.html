<!DOCTYPE html>
<html>
<head>
    <title>CSS Practice</title>
    <style>
    p{
        color: blue
    }
    #main-heading{
          color:green
    }
    </style>
</head>
<body>

    <h1 id="main-heading">Welcome to CSS Practice</h1>

    <p>This is a normal paragraph.</p>

    <p class="text">This paragraph has a class.</p>

    

    <div class="box">
        <h2>Inside Div</h2>
        <p>This paragraph is inside the div.</p>

        <div>
            <p>Nested paragraph inside another div.</p>
        </div>
    </div>

    <button>Click Me</button>

    <ul>
        <li>HTML</li>
        <li>CSS</li>
        <li>JavaScript</li>
    </ul>

    <input type="text" placeholder="Enter name">
    <input type="password" placeholder="Password">

</body>
</html>
