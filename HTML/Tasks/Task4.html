<!DOCTYPE html>
<html>
<head>
    <title>Table Layout</title>
</head>

<body>

<table border="1" width="800" align="center" cellpadding="10" cellspacing="0">

    <!-- Row 1 -->
    <tr>
        <!-- Left Image -->
        <td rowspan="5" width="30%" height="500">
            <img src="images/indixpert.png" width="100%" height="100%">
        </td>

        <!-- Logo -->
        <td colspan="3" align="center" height="80">
            <img src="images/indixpert_logo.jpeg" width="120">
        </td>
    </tr>

    <!-- Row 2 (Big Image) -->
    <tr>
        <td colspan="3" height="200">
            <img src="images/image2.jpeg" width="100%" height="200">
        </td>
    </tr>

    <!-- Row 3 (2 Images) -->
    <tr>
        <td colspan="2" height="120">
            <img src="images/download.png" width="100%" height="120">
        </td>
        <td height="120">
            <img src="images/image_3.jpeg" width="100%" height="120">
        </td>
    </tr>

    <!-- Row 4 (3 Images) -->
    <tr>
        <td height="100">
            <img src="images/image_4.jpeg" width="100%" height="100">
        </td>
        <td height="100">
            <img src="images/image_5.jpeg" width="100%" height="100">
        </td>
        <td height="100">
            <img src="images/images.jpeg" width="100%" height="100">
        </td>
    </tr>

    <!-- Row 5 (Footer) -->
    <tr>
        <td colspan="3" align="center" height="60">
            <img src="images/image1.png" width="100%" height="100">
        </td>
    </tr>

</table>

</body>
</html>
