<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Registration Form">
    <meta name="keywords" content="Registration Form, HTML5">
    <meta name="author" content="Sonali Shahi">
    <title>Registration Form</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body>

    <div class="container mt-5">

        <div class="row justify-content-center">

            <div class="col-lg-7">

                <div class="card shadow p-4">

                    <h1 class="mb-4">Registration Form</h1>

                    <form class="needs-validation">

                        <!-- First & Last Name -->
                        <div class="row">

                            <div class="col-md-6 mb-3">
                                <label for="fname" class="form-label">First Name</label>

                                <input type="text" class="form-control" id="fname" name="fname" minlength="3"
                                    maxlength="30" pattern="(?=.*[A-Za-zÀ-ÿ].*[A-Za-zÀ-ÿ])[A-Za-zÀ-ÿ\s'\-]{2,30}"
                                    required>

                                <div class="invalid-feedback">
                                    Name is required and must have at least 3 characters.
                                </div>
                            </div>

                            <div class="col-md-6 mb-3">
                                <label for="lname" class="form-label">Last Name</label>

                                <input type="text" class="form-control" id="lname" name="lname" minlength="3"
                                    maxlength="30" pattern="(?=.*[A-Za-zÀ-ÿ].*[A-Za-zÀ-ÿ])[A-Za-zÀ-ÿ\s'\-]{2,30}"
                                    required>

                                <div class="invalid-feedback">
                                    Last name is required.
                                </div>
                            </div>
                        </div>
                        <!-- Email -->

                        <div class="mb-3">
                            <label for="email" class="form-label">Email</label>
                            <input type="email" class="form-control" id="email" name="email"
                                pattern="[a-zA-Z0-9._%+\-]+@company\.com" required>
                            <div class="invalid-feedback">
                                Please enter a valid email address.
                            </div>
                        </div>

                        <!-- Phone -->

                        <div class="mb-3">

                            <label for="phone" class="form-label">Phone</label>
                            <input type="tel" class="form-control" id="phone" name="phone"
                                pattern="^(\+91|0)?[6-9][0-9]{9}$" required>
                            <div class="invalid-feedback">
                                Enter a valid 10 digit mobile number.
                            </div>

                        </div>
                        <!-- Password -->

                        <div class="mb-3">

                            <label for="password" class="form-label">Password</label>

                            <input type="password" class="form-control" id="password" minlength="8" name="password"
                                pattern="(?=.*\d)(?=.*[a-z])(?=.*[A-Z])(?=.*[!@#$%^&*()_\-+\s]).{8,}" required>

                            <div class="invalid-feedback">
                                Password must contain at least 8 characters.
                            </div>

                        </div>

                        <!-- DOB & Gender -->

                        <div class="row">

                            <div class="col-md-6 mb-3">

                                <label for="dob" class="form-label">DOB</label>

                                <input type="date" class="form-control" id="dob" max="2008-12-31" name="dob" required>
                                <div class="invalid-feedback">
                                    Select a valid date of birth.
                                </div>

                            </div>

                            <div class="col-md-6 mb-3">

                                <label class="form-label d-block">Gender</label>

                                <div class="form-check form-check-inline">

                                    <input class="form-check-input" type="radio" id="male" name="gender" value="Male"
                                        checked>

                                    <label class="form-check-label">
                                        Male
                                    </label>

                                </div>

                                <div class="form-check form-check-inline">

                                    <input class="form-check-input" type="radio" id="female" name="gender"
                                        value="Female">

                                    <label class="form-check-label" for="female">
                                        Female
                                    </label>
                                </div>

                                <div class="form-check form-check-inline">

                                    <input class="form-check-input" type="radio" id="others" name="gender"
                                        value="Others">

                                    <label class="form-check-label" for="others">
                                        Others
                                    </label>

                                </div>

                            </div>

                        </div>

                        <!-- Country & City -->

                        <div class="row">

                            <div class="col-md-6 mb-3">

                                <label for="country" class="form-label">Country</label>

                                <select id="country" class="form-select" name="country" required>

                                    <option value="">Select Country</option>
                                    <option>India</option>
                                    <option>USA</option>
                                    <option>UK</option>
                                    <option>Canada</option>

                                </select>

                                <div class="invalid-feedback">
                                    Please select your country.
                                </div>

                            </div>
                            <div class="col-md-6 mb-3">

                                <label for="city" class="form-label">City</label>

                                <input type="text" id="city" class="form-control" name="city" pattern="[A-Za-z ]+"
                                    required>

                                <div class="invalid-feedback">
                                    Please enter city.
                                </div>

                            </div>
                        </div>
                        <div class="mt-3">
                            <button type="submit" class="btn btn-outline-dark">
                                Submit
                            </button>
                        </div>

                    </form>

                </div>

            </div>

        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="main.js"></script>

</body>

</html>
